name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '00 3 1 * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build the Docker image
      run: docker build . --tag ghcr.io/flemmingkrarup/cups:latest

    # Only publish from trusted events - pull requests just verify that the image builds
    - name: Log in to GHCR
      if: github.event_name != 'pull_request'
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: echo "$GH_PAT" | docker login ghcr.io --username FlemmingKrarup --password-stdin

    - name: Push the Docker image
      if: github.event_name != 'pull_request'
      run: docker push ghcr.io/flemmingkrarup/cups:latest
